name: CampusFlow checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: campusflow_test
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f ops-service/pom.xml verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/campusflow_test
          DATABASE_USERNAME: campusflow
          DATABASE_PASSWORD: disposable-ci-password
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix frontend ci
      - run: npm run build
        env:
          CI: "true"
      - run: mvn -B -f ops-service/pom.xml package
      - run: npx playwright install --with-deps chrome
      - name: Start local services and wait for readiness
        run: |
          (cd ops-service && java -jar target/ops-service-1.0.0.jar > /tmp/campusflow-api.log 2>&1) &
          (BROWSER=none npm run dev:web > /tmp/campusflow-web.log 2>&1) &
          for port in 8080 3000; do
            ready=0
            for attempt in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/$(test "$port" = 8080 && echo actuator/health)" > /dev/null; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1 || { cat /tmp/campusflow-api.log /tmp/campusflow-web.log; exit 1; }
          done
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: |
            playwright-report/
            test-results/
