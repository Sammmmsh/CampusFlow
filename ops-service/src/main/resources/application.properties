spring.application.name=campusflow-ops
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./.runtime/campusflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.sql.init.mode=never
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
ops.allowed-origin=${APP_ORIGIN:http://localhost:3000}
ops.cookie-secure=${COOKIE_SECURE:false}
ops.demo-enabled=${DEMO_ENABLED:true}
ops.calendar-id=${GOOGLE_CALENDAR_ID:}
ops.calendar-token=${GOOGLE_CALENDAR_ACCESS_TOKEN:}
ops.dispatch-delay=${DISPATCH_DELAY:30000}
