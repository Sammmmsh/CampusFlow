<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2250" viewBox="0 0 1800 2250" role="img" aria-labelledby="title desc"><title id="title">CampusFlow Ops architecture and request workflow</title><desc id="desc">Students request equipment, faculty approve against inventory capacity, and inventory managers record collection and return. A Spring Boot service commits state changes, audit events and calendar jobs to a separate SQL database. Calendar deliveries can safely retry. React is deployed on Vercel; Spring Boot uses a Docker host.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6941c6" stroke-width="1.6"/></marker></defs><rect width="1800" height="2250" fill="#f7f4fc"/><g font-family="Segoe UI,Arial,sans-serif">
