<rect x="920" y="1921" width="810" height="218" rx="22" fill="#fff" stroke="#d8cde8"/>
<text x="100" y="1967" font-size="29" fill="#292039" font-weight="650"><tspan x="100" dy="0">Test the awkward paths</tspan></text>
<text x="100" y="2012" font-size="23" fill="#6b5e7a" font-weight="400"><tspan x="100" dy="0">Concurrent approvals · adjacent reservations · late returns</tspan><tspan x="100" dy="32.66">Cross-workspace access · forged sessions · CSRF</tspan><tspan x="100" dy="32.66">Full browser journey · mobile layout · axe checks</tspan></text>
<text x="950" y="1967" font-size="29" fill="#292039" font-weight="650"><tspan x="950" dy="0">Keep boundaries honest</tspan></text>
<text x="950" y="2012" font-size="23" fill="#6b5e7a" font-weight="400"><tspan x="950" dy="0">Accounts and sample workspaces stay separate.</tspan><tspan x="950" dy="32.66">Google Calendar live mode needs separate credentials.</tspan><tspan x="950" dy="32.66">Original academic portal / MongoDB stays separate.</tspan></text>
<text x="70" y="2191" font-size="27" fill="#292039" font-weight="600"><tspan x="70" dy="0">Built around campus life. Designed to explain, test and recover.</tspan></text>
