<text x="100" y="873" font-size="31" fill="#292039" font-weight="650"><tspan x="100" dy="0">React workspace</tspan></text>
<text x="100" y="916" font-size="23" fill="#6941c6" font-weight="600"><tspan x="100" dy="0">Frontend / Vercel</tspan></text>
<text x="100" y="968" font-size="23" fill="#6b5e7a" font-weight="400"><tspan x="100" dy="0">Responsive, keyboard-friendly UI</tspan><tspan x="100" dy="32.66">Search, filters and request forms</tspan><tspan x="100" dy="32.66">Role-specific actions and history</tspan><tspan x="100" dy="32.66">Loading, error and empty states</tspan></text>
<rect x="95" y="1139" width="390" height="58" rx="22" fill="#f6f1fc" stroke="#d8cde8"/>
<text x="114" y="1176" font-size="22" fill="#6941c6" font-weight="600"><tspan x="114" dy="0">Same-origin /api/ops requests</tspan></text>
<text x="615" y="873" font-size="31" fill="#292039" font-weight="650"><tspan x="615" dy="0">Java 17 + Spring Boot</tspan></text>
<text x="615" y="916" font-size="23" fill="#6941c6" font-weight="600"><tspan x="615" dy="0">REST API / Docker service</tspan></text>
<text x="615" y="968" font-size="23" fill="#6b5e7a" font-weight="400"><tspan x="615" dy="0">BCrypt accounts + cookie / CSRF validation</tspan><tspan x="615" dy="32.66">Invited roles + workspace isolation</tspan><tspan x="615" dy="32.66">Validation + idempotent request creation</tspan><tspan x="615" dy="32.66">Transactional workflow and SQL row locks</tspan></text>
<rect x="610" y="1139" width="585" height="58" rx="22" fill="#fff" stroke="#d8cde8"/>
<text x="630" y="1176" font-size="23" fill="#6941c6" font-weight="600"><tspan x="630" dy="0">Peak-capacity sweep over booking intervals</tspan></text>
<text x="1325" y="873" font-size="31" fill="#292039" font-weight="650"><tspan x="1325" dy="0">SQL persistence</tspan></text>
<text x="1325" y="916" font-size="23" fill="#6941c6" font-weight="600"><tspan x="1325" dy="0">Neon PostgreSQL / Flyway</tspan></text>
<text x="1325" y="968" font-size="23" fill="#6b5e7a" font-weight="400"><tspan x="1325" dy="0">workspaces · sessions</tspan><tspan x="1325" dy="32.66">accounts · invitations</tspan><tspan x="1325" dy="32.66">equipment · requests</tspan><tspan x="1325" dy="32.66">audit_events · calendar_jobs</tspan><tspan x="1325" dy="32.66">Foreign keys + unique constraints</tspan></text>
