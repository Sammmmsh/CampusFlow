<text x="100" y="109" font-size="24" fill="#d9c9f1" font-weight="600"><tspan x="100" dy="0">CAMPUSFLOW / OPERATIONS ENGINEERING</tspan></text>
<text x="100" y="183" font-size="51" fill="white" font-weight="650"><tspan x="100" dy="0">Small campus requests. Serious engineering.</tspan></text>
<text x="100" y="239" font-size="27" fill="#e4d9f2" font-weight="400"><tspan x="100" dy="0">A complete equipment workflow with traceable decisions and recoverable integrations.</tspan></text>
